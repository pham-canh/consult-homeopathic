<!doctype html>
<html lang="en">

  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="dot">✚</div>
      <div>Consult <small>Follow-up check-in · prototype</small></div>
    </div>
    <div class="top-actions">
      <span class="pill amber">Synthetic demo</span>
      <a class="btn ghost small" href="/">Patient intake</a>
